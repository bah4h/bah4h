<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS TESTER PRO MAX</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #121212;
            --light: #ffffff;
            --accent: #fd79a8;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --cyber-blue: #00f5ff;
            --cyber-pink: #ff00f5;
            --neon-green: #00ff9d;
        }
        
        @font-face {
            font-family: 'Cyber';
            src: url('https://fonts.cdnfonts.com/css/cyberpunk') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cyber', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f0f1a 0%, #000000 100%);
            color: var(--light);
            overflow-x: hidden;
        }
        
        .cyber-glitch {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            width: 95%;
            max-width: 600px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.3),
                        0 0 60px rgba(253, 121, 168, 0.2),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }
        
        h1 {
            margin-bottom: 20px;
            color: transparent;
            font-weight: 700;
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--cyber-blue), var(--cyber-pink), var(--neon-green));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
            letter-spacing: 2px;
            position: relative;
        }
        
        h1::after {
            content: 'PRO MAX';
            position: absolute;
            top: -10px;
            right: -30px;
            font-size: 0.8rem;
            background: var(--danger);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            transform: rotate(15deg);
        }
        
        .fps-display {
            margin: 20px 0;
            position: relative;
        }
        
        #fpsCounter {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--cyber-blue), var(--cyber-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            font-family: 'Cyber', monospace;
            line-height: 1;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(0, 245, 255, 0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--cyber-blue), var(--cyber-pink));
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--light);
            font-family: 'Cyber', monospace;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #fpsCanvas {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.2);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Cyber', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border: 1px solid rgba(0, 245, 255, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .mode-btn {
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 245, 255, 0.2);
            color: var(--light);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(45deg, var(--cyber-blue), var(--cyber-pink));
            color: black;
            font-weight: bold;
        }
        
        .history-graph {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 245, 255, 0.1);
        }
        
        .graph-point {
            position: absolute;
            bottom: 0;
            width: 3px;
            background: var(--cyber-blue);
            border-radius: 2px;
        }
        
        .warning {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 20px;
            line-height: 1.5;
            color: var(--warning);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                width: 98%;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            #fpsCounter {
                font-size: 3.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="cyber-glitch"></div>
    
    <div class="container">
        <h1>FPS TESTER <span style="position: absolute; top: -10px; right: -30px; background: var(--danger); color: white; padding: 2px 5px; border-radius: 3px; transform: rotate(15deg); font-size: 0.8rem;">ULTRA</span></h1>
        
        <div class="fps-display">
            <div id="fpsCounter">0</div>
        </div>
        
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-value" id="avgFPS">0</div>
                <div class="stat-label">Average</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="minFPS">0</div>
                <div class="stat-label">Minimum</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="maxFPS">0</div>
                <div class="stat-label">Maximum</div>
            </div>
        </div>
        
        <div class="mode-selector">
            <div class="mode-btn active" data-mode="light">Light Test</div>
            <div class="mode-btn" data-mode="medium">Medium Test</div>
            <div class="mode-btn" data-mode="heavy">Heavy Test</div>
            <div class="mode-btn" data-mode="extreme">Extreme</div>
        </div>
        
        <canvas id="fpsCanvas"></canvas>
        
        <div class="history-graph" id="historyGraph">
            <div id="graphPoints"></div>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Benchmark</button>
            <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>
        
        <div class="warning">
            For accurate results:<br>
            - Keep this tab active<br>
            - Disable power saving modes<br>
            - Close other applications
        </div>
    </div>

    <script>
        // DOM Elements
        const fpsCounter = document.getElementById('fpsCounter');
        const avgFPS = document.getElementById('avgFPS');
        const minFPS = document.getElementById('minFPS');
        const maxFPS = document.getElementById('maxFPS');
        const canvas = document.getElementById('fpsCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const graphPoints = document.getElementById('graphPoints');
        const modeButtons = document.querySelectorAll('.mode-btn');

        // Set canvas resolution
        canvas.width = canvas.offsetWidth * 2;
        canvas.height = canvas.offsetHeight * 2;
        ctx.scale(2, 2);

        // State variables
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;
        let fpsHistory = [];
        let allFPSHistory = [];
        const avgOverSeconds = 5;
        let animationId = null;
        let isRunning = false;
        let startTimestamp = 0;
        let testMode = 'light';
        let benchmarkDuration = 10000; // 10 seconds
        let testObjects = [];
        let testComplexity = 1;
        
        // Initialize
        resetTest();
        
        // Button event listeners
        startBtn.addEventListener('click', toggleBenchmark);
        resetBtn.addEventListener('click', resetTest);
        
        // Mode selection
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                testMode = btn.dataset.mode;
                updateTestComplexity();
            });
        });
        
        function updateTestComplexity() {
            switch(testMode) {
                case 'light': testComplexity = 1; break;
                case 'medium': testComplexity = 2; break;
                case 'heavy': testComplexity = 4; break;
                case 'extreme': testComplexity = 8; break;
            }
        }
        
        function createTestObject() {
            const size = 20 + Math.random() * 30 * testComplexity;
            const speed = 1 + Math.random() * 2 * testComplexity;
            
            testObjects.push({
                x: Math.random() * (canvas.width/2 - size),
                y: Math.random() * (canvas.height/2 - size),
                size: size,
                speedX: (Math.random() - 0.5) * speed,
                speedY: (Math.random() - 0.5) * speed,
                color: `hsla(${Math.random() * 360}, 80%, 60%, 0.8)`,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1 * testComplexity
            });
        }
        
        function updateTestObjects() {
            for (let i = 0; i < testObjects.length; i++) {
                const obj = testObjects[i];
                
                obj.x += obj.speedX;
                obj.y += obj.speedY;
                obj.rotation += obj.rotationSpeed;
                
                // Bounce off walls
                if (obj.x <= 0 || obj.x >= canvas.width/2 - obj.size) {
                    obj.speedX *= -1;
                }
                if (obj.y <= 0 || obj.y >= canvas.height/2 - obj.size) {
                    obj.speedY *= -1;
                }
            }
        }
        
        function drawTestObjects() {
            testObjects.forEach(obj => {
                ctx.save();
                ctx.translate(obj.x + obj.size/2, obj.y + obj.size/2);
                ctx.rotate(obj.rotation);
                
                ctx.fillStyle = obj.color;
                
                if (testComplexity > 2) {
                    // More complex shapes for higher test modes
                    ctx.beginPath();
                    if (testComplexity >= 4) {
                        // Star shape
                        const spikes = 5;
                        const outerRadius = obj.size/2;
                        const innerRadius = outerRadius * 0.5;
                        let rot = Math.PI/2 * 3;
                        
                        ctx.moveTo(0, 0 - outerRadius);
                        for (let i = 0; i < spikes; i++) {
                            ctx.lineTo(0, 0 - innerRadius);
                            rot += Math.PI / spikes;
                            ctx.lineTo(Math.sin(rot) * outerRadius, Math.cos(rot) * outerRadius);
                            rot += Math.PI / spikes;
                        }
                        ctx.closePath();
                    } else {
                        // Polygon
                        const sides = 3 + Math.floor(testComplexity);
                        const size = obj.size/2;
                        ctx.moveTo(size, 0);
                        for (let i = 1; i <= sides; i++) {
                            const angle = i * 2 * Math.PI / sides;
                            ctx.lineTo(size * Math.cos(angle), size * Math.sin(angle));
                        }
                        ctx.closePath();
                    }
                    ctx.fill();
                } else {
                    // Simple rectangle for light mode
                    ctx.fillRect(-obj.size/2, -obj.size/2, obj.size, obj.size);
                }
                
                ctx.restore();
            });
        }
        
        function drawStressTest(now) {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width/2, canvas.height/2);
            
            // Draw test objects
            updateTestObjects();
            drawTestObjects();
            
            // Draw center pulse effect for higher modes
            if (testComplexity > 1) {
                const pulseSize = (Math.sin(now/200) * 0.5 + 0.5) * 50 * testComplexity;
                ctx.fillStyle = `hsla(${(now/10) % 360}, 80%, 60%, 0.3)`;
                ctx.beginPath();
                ctx.arc(canvas.width/4, canvas.height/4, pulseSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function updateGraph() {
            graphPoints.innerHTML = '';
            const graphHeight = 100;
            const maxFPS = Math.max(60, ...allFPSHistory.slice(-30)) || 60;
            
            allFPSHistory.slice(-30).forEach((fps, i) => {
                const point = document.createElement('div');
                point.className = 'graph-point';
                point.style.height = `${(fps / maxFPS) * graphHeight}px`;
                point.style.left = `${(i / 30) * 100}%`;
                
                // Color based on FPS
                if (fps > 50) point.style.background = 'var(--success)';
                else if (fps > 30) point.style.background = 'var(--warning)';
                else point.style.background = 'var(--danger)';
                
                graphPoints.appendChild(point);
            });
        }
        
        function updateFPS(now) {
            frameCount++;
            const deltaTime = now - lastTime;
            
            if (deltaTime >= 1000) {
                fps = Math.round((frameCount * 1000) / deltaTime);
                fpsHistory.push(fps);
                allFPSHistory.push(fps);
                
                if (fpsHistory.length > avgOverSeconds) fpsHistory.shift();
                
                // Update displays
                fpsCounter.textContent = fps;
                
                if (fpsHistory.length >= 3) {
                    const avg = Math.round(fpsHistory.reduce((a, b) => a + b) / fpsHistory.length);
                    const min = Math.min(...fpsHistory);
                    const max = Math.max(...fpsHistory);
                    
                    avgFPS.textContent = avg;
                    minFPS.textContent = min;
                    maxFPS.textContent = max;
                }
                
                frameCount = 0;
                lastTime = now;
                
                // Update graph
                updateGraph();
                
                // Check if benchmark is complete
                if (isRunning && now - startTimestamp >= benchmarkDuration) {
                    completeBenchmark();
                }
            }
            
            if (isRunning) {
                drawStressTest(now);
            }
            animationId = requestAnimationFrame(updateFPS);
        }
        
        function toggleBenchmark() {
            if (isRunning) {
                // Stop the benchmark
                completeBenchmark();
            } else {
                // Start a new benchmark
                startBenchmark();
            }
        }
        
        function startBenchmark() {
            startTimestamp = performance.now();
            lastTime = performance.now();
            frameCount = 0;
            fpsHistory = [];
            testObjects = [];
            
            // Create initial test objects
            for (let i = 0; i < testComplexity * 2; i++) {
                createTestObject();
            }
            
            animationId = requestAnimationFrame(updateFPS);
            startBtn.textContent = 'STOP BENCHMARK';
            isRunning = true;
        }
        
        function completeBenchmark() {
            cancelAnimationFrame(animationId);
            isRunning = false;
            startBtn.textContent = 'START BENCHMARK';
            
            // Clear canvas when stopped
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width/2, canvas.height/2);
        }
        
        function resetTest() {
            if (isRunning) {
                cancelAnimationFrame(animationId);
                isRunning = false;
            }
            
            fpsCounter.textContent = '0';
            avgFPS.textContent = '0';
            minFPS.textContent = '0';
            maxFPS.textContent = '0';
            
            fpsHistory = [];
            allFPSHistory = [];
            frameCount = 0;
            lastTime = performance.now();
            testObjects = [];
            
            startBtn.textContent = 'START BENCHMARK';
            
            // Clear canvas and graph
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width/2, canvas.height/2);
            graphPoints.innerHTML = '';
        }
        
        // Start the FPS counter (without animation)
        animationId = requestAnimationFrame(updateFPS);
    </script>
</body>
</html>
